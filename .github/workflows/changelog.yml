name: Changelog

on:
  pull_request:
    branches: [main, develop]

jobs:
  changelog:
    name: Changelog gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Zero-dependency script, so no install step is needed. Fails when src/**
      # changed without a CHANGELOG.md entry, when the top changelog version does
      # not match package.json, or on an em-dash. Skips dependabot PRs.
      - name: Changelog gate
        run: node scripts/ci-changelog.mjs
