name: CI

# This repo had no CI at all. Its only workflow was `pages.yml`, a deploy that
# runs on push to main, so no pull request has ever been gated: `lint`, `test`
# and `build` were declared in package.json and never ran in automation. The
# package is published to npm as @attestto/verify and also serves
# verify.attestto.com, so both the published artifact and a live site were
# reaching users through a repo with no PR gate.
#
# Every branch and every pull request. A gate that only covers the last hop into
# main is not a gate: the same narrow trigger let 37 commits reach
# attestto-creds-extension ungated, and let a stacked PR merge unchecked in
# attestto-did-resolver.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because the coverage ratchet's NO-DROP rule resolves
      # `git merge-base HEAD <base>` to prove the committed baseline was not
      # lowered. The default shallow depth of 1 leaves no merge-base, and the
      # rule would silently never run — a gate that cannot see its reference
      # point is precisely the decorative control the self-test exists to catch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Runs FIRST and deliberately: it proves the gates below can fail, by
      # seeding a violation of each one and requiring a non-zero exit. Every
      # blocker found in the 2026-08-11 audit was a control that existed and had
      # never executed, so "the step is present" stopped counting as evidence.
      # See scripts/gate-self-test.mjs.
      - name: Gate self-test
        run: pnpm gate-self-test

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      # Coverage may go up, never down. Two rules run here that a local
      # pre-push hook cannot enforce on its own:
      #   FLOOR   — every metric >= coverage-baseline.json
      #   NO-DROP — the committed baseline is itself >= the baseline at the
      #             merge-base, so a PR cannot lower the bar in the same commit
      #             that drops coverage.
      # The hook can be skipped with `git push --no-verify`; this step cannot.
      #
      # COVERAGE_BASE_REF goes through `env:` rather than being interpolated
      # into `run:` — a branch name is attacker-influenced text, and inlining it
      # in a shell command is the standard Actions injection sink.
      - name: Coverage ratchet
        env:
          COVERAGE_BASE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}
        run: pnpm run coverage:check

      # Runs AFTER the tests, so a failure lands on the cheapest step first.
      - name: Build
        run: pnpm run build

      # This package is published to npm. A tarball that omits dist/ breaks every
      # consumer, and `npm publish` is the wrong place to discover it.
      #
      # `pack`, NOT `publish --dry-run`: the latter also checks the registry and
      # fails with "You cannot publish over the previously published versions"
      # for any version already released, which is the normal state of main and
      # would leave this red forever.
      - name: Validate the publishable tarball
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          tarball="$(find "$RUNNER_TEMP" -name 'attestto-verify-*.tgz' | head -1)"
          echo "packed: $tarball"
          if ! tar -tzf "$tarball" | grep -q '^package/dist/attestto-verify.js$'; then
            echo "::error::the tarball does not contain dist/attestto-verify.js, the package main entry"
            tar -tzf "$tarball" | head -40
            exit 1
          fi
